include:
  - ./docker-compose-base.yml

services:
  cablerag-cpu:
    build:
      context: ..
      dockerfile: Dockerfile
      # WEB_DIST_MODE=prebuilt ships a locally built web/dist instead of
      # building it in-container; WEB_BUILD_HEAP_MB caps the V8 heap used by
      # that build. Both can be set in docker/.env.
      args:
        WEB_DIST_MODE: ${WEB_DIST_MODE:-build}
        WEB_BUILD_HEAP_MB: ${WEB_BUILD_HEAP_MB:-4096}
    image: ${RAGFLOW_IMAGE:-my-cablerag:latest}
    container_name: cablerag-cpu
    depends_on:
      mysql:
        condition: service_healthy
        required: false
      nats:
        condition: service_healthy
        required: false
    profiles:
      - cpu
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      nproc:
        soft: 65535
        hard: 65535
    command:
      - --enable-adminserver
      - --init-model-provider-tables
    ports:
      - ${SVR_WEB_HTTP_PORT}:80
      - ${SVR_WEB_HTTPS_PORT}:443
      - ${SVR_HTTP_PORT}:9380
      - ${ADMIN_SVR_HTTP_PORT}:9381
      - ${SVR_MCP_PORT}:9382
      - ${GO_HTTP_PORT}:9384
      - ${GO_ADMIN_PORT}:9383
    environment:
      - SANDBOX_EXECUTOR_MANAGER_API_TOKEN=${SANDBOX_EXECUTOR_MANAGER_API_TOKEN:-}
    volumes:
      - ./ragflow-logs:/ragflow/logs
      - ./service_conf.yaml.template:/ragflow/conf/service_conf.yaml.template
      - ./entrypoint.sh:/ragflow/entrypoint.sh
    env_file: .env
    networks:
      - ragflow
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  cablerag-gpu:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        WEB_DIST_MODE: ${WEB_DIST_MODE:-build}
        WEB_BUILD_HEAP_MB: ${WEB_BUILD_HEAP_MB:-4096}
    image: ${RAGFLOW_IMAGE:-my-cablerag:latest}
    container_name: cablerag-gpu
    depends_on:
      mysql:
        condition: service_healthy
        required: false
      nats:
        condition: service_healthy
        required: false
    profiles:
      - gpu
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      nproc:
        soft: 65535
        hard: 65535
    command:
      - --enable-adminserver
    ports:
      - ${SVR_WEB_HTTP_PORT}:80
      - ${SVR_WEB_HTTPS_PORT}:443
      - ${SVR_HTTP_PORT}:9380
      - ${ADMIN_SVR_HTTP_PORT}:9381
      - ${SVR_MCP_PORT}:9382
    volumes:
      - ./ragflow-logs:/ragflow/logs
      - ./service_conf.yaml.template:/ragflow/conf/service_conf.yaml.template
      - ./entrypoint.sh:/ragflow/entrypoint.sh
    environment:
      - SANDBOX_EXECUTOR_MANAGER_API_TOKEN=${SANDBOX_EXECUTOR_MANAGER_API_TOKEN:-}
    env_file: .env
    networks:
      - ragflow
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]