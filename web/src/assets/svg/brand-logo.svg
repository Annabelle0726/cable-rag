<?xml version="1.0" encoding="UTF-8"?>
<!--
  Cable RAG brand mark.

  Rendered through <img> by src/components/svg-icon.tsx (name="brand-logo"), so it
  is also the avatar fallback used by the assistant and message items. Colors are
  literal rather than currentColor for the same reason, and are picked from the
  cable theme palette in tailwind.css so the mark reads on both the light
  (cable brand soft) and dark (cable surface) header backgrounds:
  connector/cable #3B82F6, copper terminals #F59E0B.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" role="img" aria-label="Cable RAG">
  <title>Cable RAG</title>
  <!-- connector shell -->
  <rect x="2.25" y="8.5" width="5.5" height="7" rx="1.75" stroke="#3B82F6" stroke-width="1.6" />
  <!-- pins -->
  <path d="M7.75 10.75h1.75M7.75 13.25h1.75" stroke="#3B82F6" stroke-width="1.6" stroke-linecap="round" />
  <!-- cable running from the pins to the splice -->
  <path d="M9.5 12h1.5" stroke="#3B82F6" stroke-width="1.6" stroke-linecap="round" />
  <!-- splice where the cable fans out -->
  <circle cx="12" cy="12" r="1.4" fill="#F59E0B" />
  <!-- branches to the two terminals -->
  <path d="M12 12c0-2.75 1.6-4 3.4-4h.85M12 12c0 2.75 1.6 4 3.4 4h.85" stroke="#3B82F6" stroke-width="1.6" stroke-linecap="round" />
  <!-- copper terminals -->
  <circle cx="18.15" cy="8" r="1.9" stroke="#F59E0B" stroke-width="1.5" />
  <circle cx="18.15" cy="16" r="1.9" stroke="#F59E0B" stroke-width="1.5" />
  <circle cx="18.15" cy="8" r="0.65" fill="#F59E0B" />
  <circle cx="18.15" cy="16" r="0.65" fill="#F59E0B" />
</svg>
