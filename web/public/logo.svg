<?xml version="1.0" encoding="UTF-8"?>
<!--
  Cable RAG logo used as the browser favicon (index.html) and by the login, admin
  and embed pages, which reference it as /logo.svg.

  Same artwork as src/assets/svg/brand-logo.svg so the product mark exists in one
  shape; stroke weights are marginally heavier for legibility at favicon size.
  Palette follows the cable theme in tailwind.css (blue #3B82F6 body, copper
  #F59E0B terminals) and is literal because the file is loaded through <img>.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32" fill="none" role="img" aria-label="Cable RAG">
  <title>Cable RAG</title>
  <!-- connector shell -->
  <rect x="2.25" y="8.5" width="5.5" height="7" rx="1.75" stroke="#3B82F6" stroke-width="1.7" />
  <!-- pins -->
  <path d="M7.75 10.75h1.75M7.75 13.25h1.75" stroke="#3B82F6" stroke-width="1.7" stroke-linecap="round" />
  <!-- cable running from the pins to the splice -->
  <path d="M9.5 12h1.5" stroke="#3B82F6" stroke-width="1.7" stroke-linecap="round" />
  <!-- splice where the cable fans out -->
  <circle cx="12" cy="12" r="1.45" fill="#F59E0B" />
  <!-- branches to the two terminals -->
  <path d="M12 12c0-2.75 1.6-4 3.4-4h.85M12 12c0 2.75 1.6 4 3.4 4h.85" stroke="#3B82F6" stroke-width="1.7" stroke-linecap="round" />
  <!-- copper terminals -->
  <circle cx="18.15" cy="8" r="1.95" stroke="#F59E0B" stroke-width="1.6" />
  <circle cx="18.15" cy="16" r="1.95" stroke="#F59E0B" stroke-width="1.6" />
  <circle cx="18.15" cy="8" r="0.7" fill="#F59E0B" />
  <circle cx="18.15" cy="16" r="0.7" fill="#F59E0B" />
</svg>
